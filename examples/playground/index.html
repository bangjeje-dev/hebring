<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEBRING — Local Playground</title>

  <!-- Load HEBRING framework core -->
  <link rel="stylesheet" href="../../src/index.css">

  <style>
    /* Playground-specific minimal styles */
    body {
      padding: 2rem;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>

  <header>
    <h1>HEBRING Playground</h1>
    <p>Minimal local environment for visual development and demonstration.</p>
  </header>

  <main>
    <!-- Component prototypes will be previewed here -->
    <section style="margin-top: 2rem;">
      <h2>Buttons (Phase 07.5)</h2>

      <div style="margin-bottom: 2rem;">
        <h3>Variants</h3>
        <div class="hb-cluster">
          <button class="hb-button">Default</button>
          <button class="hb-button hb-button--secondary">Secondary</button>
          <button class="hb-button hb-button--danger">Danger</button>
        </div>
      </div>

      <div style="margin-bottom: 2rem;">
        <h3>Sizes</h3>
        <div class="hb-cluster">
          <button class="hb-button hb-button--sm">Small</button>
          <button class="hb-button">Medium (Default)</button>
          <button class="hb-button hb-button--lg">Large</button>
        </div>
      </div>

      <div style="margin-bottom: 2rem;">
        <h3>States</h3>
        <div class="hb-cluster">
          <button class="hb-button" disabled>Disabled</button>
          <button class="hb-button is-loading" aria-busy="true">Loading</button>
        </div>
      </div>

      <div style="margin-bottom: 2rem;">
        <h3>Combinations</h3>
        <div class="hb-cluster">
          <button class="hb-button hb-button--danger hb-button--sm">Delete</button>
          <button class="hb-button hb-button--secondary hb-button--lg">Cancel</button>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
