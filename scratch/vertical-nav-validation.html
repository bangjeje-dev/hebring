<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vertical Navigation Validation</title>
  <link rel="stylesheet" href="../dist/hebring.css">
  <link rel="stylesheet" href="../ecosystem/ui/vertical-nav.css">
  <style>
    body {
      padding: 2rem;
      background-color: var(--hb-color-background);
      color: var(--hb-color-text);
      font-family: var(--hb-font-body);
    }
    .sidebar-stub {
      width: 250px;
      border-right: 1px solid var(--hb-color-border);
      padding-right: 1rem;
      height: 100vh;
    }
  </style>
</head>
<body>

  <div class="sidebar-stub">
    <nav class="hb-vertical-nav" aria-label="Main Navigation">
      
      <!-- Group 1 -->
      <div class="hb-vertical-nav__group">
        <div class="hb-vertical-nav__label" id="nav-workspace">Workspace</div>
        <ul class="hb-vertical-nav__list" aria-labelledby="nav-workspace">
          <li class="hb-vertical-nav__item">
            <a href="#" class="hb-vertical-nav__link">
              <svg class="hb-vertical-nav__icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
              <span class="hb-vertical-nav__text">Dashboard</span>
            </a>
          </li>
          <li class="hb-vertical-nav__item">
            <a href="#" class="hb-vertical-nav__link" aria-current="page">
              <svg class="hb-vertical-nav__icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
              <span class="hb-vertical-nav__text">Projects</span>
            </a>
          </li>
        </ul>
      </div>

      <!-- Group 2: Commerce -->
      <div class="hb-vertical-nav__group">
        <div class="hb-vertical-nav__label" id="nav-commerce">Commerce</div>
        <ul class="hb-vertical-nav__list" aria-labelledby="nav-commerce">
          
          <li class="hb-vertical-nav__item hb-vertical-nav__item--expandable">
            <button type="button" class="hb-vertical-nav__link" aria-expanded="false" aria-controls="sub-products">
              <svg class="hb-vertical-nav__icon" viewBox="0 0 24 24"><path d="M20 16V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12m-2 4h20"></path></svg>
              <span class="hb-vertical-nav__text">Products</span>
              <span class="hb-badge" style="margin-left: auto;">New</span>
              <svg class="hb-vertical-nav__chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <ul class="hb-vertical-nav__list hb-vertical-nav__list--nested" id="sub-products" hidden>
              <li class="hb-vertical-nav__item"><a href="#" class="hb-vertical-nav__link">All Products</a></li>
              <li class="hb-vertical-nav__item"><a href="#" class="hb-vertical-nav__link">Inventory</a></li>
            </ul>
          </li>

          <li class="hb-vertical-nav__item">
            <a href="#" class="hb-vertical-nav__link" aria-disabled="true">
              <svg class="hb-vertical-nav__icon" viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon></svg>
              <span class="hb-vertical-nav__text">Orders (Disabled)</span>
            </a>
          </li>

        </ul>
      </div>
      
    </nav>
  </div>

  <script src="../ecosystem/ui/vertical-nav.js"></script>
</body>
</html>
